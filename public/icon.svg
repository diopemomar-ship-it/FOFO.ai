<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0E1528" />
      <stop offset="100%" stop-color="#021B3A" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#electricGrad)" stroke-width="8" stroke-opacity="0.4" />
  <!-- Lightning bolt / Play symbol for FOFO AI -->
  <path d="M280 80L160 270H260L230 432L360 230H250L280 80Z" fill="url(#electricGrad)" filter="url(#glow)" />
  <!-- Sparkles -->
  <circle cx="380" cy="140" r="12" fill="#00D2FF" />
  <circle cx="130" cy="380" r="10" fill="#3B82F6" />
</svg>
